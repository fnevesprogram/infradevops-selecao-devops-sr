apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-api
  namespace: comments
spec:
  # Rollout mais rápido no Autopilot (PDB minAvailable=1 + HPA min=2)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: comments-api
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
