# ESO chart 0.14.x serve v1beta1 (v1 exige ESO >= 0.16)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
  labels:
    app.kubernetes.io/name: comments-api
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
spec:
  provider:
    gcpsm:
      projectID: __GCP_PROJECT_ID__
      # Workload Identity explícito (KSA ESO → GSA external-secrets-sa)
      auth:
        workloadIdentity:
          clusterLocation: __CLUSTER_LOCATION__
          clusterName: __CLUSTER_NAME__
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
