# ESO chart 0.14.x serve v1beta1 (v1 exige ESO >= 0.16)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: comments-api-db-secret
  namespace: comments
  labels:
    app.kubernetes.io/name: comments-api
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: comments-api-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: __SECRET_REMOTE_KEY__
