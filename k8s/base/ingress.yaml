apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comments-api
  namespace: comments
  labels:
    app.kubernetes.io/name: comments-api
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comments-api
                port:
                  number: 80
