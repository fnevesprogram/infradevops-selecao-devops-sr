apiVersion: v1
kind: Service
metadata:
  name: comments-api
  namespace: comments
  labels:
    app.kubernetes.io/name: comments-api
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: comments-api
    app.kubernetes.io/component: api
