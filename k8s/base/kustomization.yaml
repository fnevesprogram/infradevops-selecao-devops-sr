apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: comments

labels:
  - pairs:
      app.kubernetes.io/part-of: comments-platform
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

images:
  - name: comments-api
    newName: comments-api
    newTag: "1.0.0"
