name: CD — GKE Autopilot v1

# Fluxo: OIDC → Artifact Registry → kubectl apply -k → verify
# Kustomize via kubectl (sem instalar binário kustomize).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-gke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER_NAME || 'dev-comments-gke' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'comments-repo' }}
  WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
  IMAGE_NAME: comments-api
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  KUBECTL_VERSION: "v1.31.0"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: ./ops/scripts/cd/require-secrets.sh

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repo
        run: ./ops/scripts/cd/ensure-artifact-registry.sh

      - name: Resolve image coordinates
        id: image
        run: |
          uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          echo "uri=${uri}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${uri}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}:${{ github.sha }}
            ${{ steps.image.outputs.uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to GKE Autopilot
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Deploy application
        run: ./ops/scripts/deploy-gcp-kustomize.sh

      - name: Verify deploy
        run: ./ops/scripts/cd/verify-deploy.sh
