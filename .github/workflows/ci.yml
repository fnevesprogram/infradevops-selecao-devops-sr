name: CI

on:
  push:
    branches: [main, "feat/**", "infra/**", "ci/**", "ops/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  KUBECTL_VERSION: "v1.31.0"

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        run: pip install -r app/requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          PYTHONPATH: .
        run: pytest -q app/tests

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Validate Kustomize overlays
        run: ./ops/scripts/ci/validate-manifests.sh

  trivy:
    name: Trivy(Scan)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: comments-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Evita aquasecurity/trivy-action + setup-trivy (download do binário falha no runner)
      - name: Scan image with Trivy (Docker)
        run: ./ops/scripts/ci/trivy-scan-image.sh comments-api:scan

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          directory: infra/terraform
          soft_fail: true
          output_format: cli
